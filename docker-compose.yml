version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a .env file next to this compose file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in a .env file next to this compose file}
      DIRECT_URL: ${DIRECT_URL:?set DIRECT_URL in a .env file next to this compose file}
    restart: unless-stopped
    container_name: teamflow
